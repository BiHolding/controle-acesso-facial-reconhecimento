name: Validate Facial Access

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-facial-access-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable .

      - name: Compile Python sources
        run: python -m compileall -q src

      - name: Run full test suite
        run: python -m unittest discover -s tests -v

      - name: Verify command entry points
        run: |
          python -c "from importlib.metadata import entry_points; names = {item.name for item in entry_points(group='console_scripts')}; required = {'reconhecer', 'reconhecer-duplo', 'painel-operador'}; missing = required - names; assert not missing, f'Missing entry points: {sorted(missing)}'"
