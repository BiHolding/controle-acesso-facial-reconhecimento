[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "controle-acesso-facial-reconhecimento"
version = "0.1.0"
description = "Cliente de reconhecimento facial integrado à API do Portal VIP"
requires-python = ">=3.12"

dependencies = [
    "opencv-python==5.0.0.93",
    "numpy==2.5.2",
    "insightface==1.0.1",
    "onnxruntime==1.29.0",
    "pymysql>=1.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "PyQt5>=5.15",
]

[project.scripts]
reconhecer = "reconhecimento.recognize:main"
reconhecer-duplo = "reconhecimento.dual_launcher:main"

[tool.setuptools.packages.find]
where = ["src"]
